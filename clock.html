<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>とけいのべんきょう フラッシュカード</title>
<style>
  :root {
    --bg: #eef1ec;
    --board: #ffffff;
    --board-edge: #d7ddd6;
    --ink: #1c2b28;
    --sub: #66756e;
    --line: #dfe6df;
    --accent: #1f8f86;
    --accent-ink: #ffffff;
    --hour: #e8874a;
    --minute: #1f8f86;
    --good: #2ea86b;
    --bad: #e0495c;
    --hole: var(--bg);
    --shadow: 0 1px 2px rgba(20,30,25,.06), 0 10px 26px rgba(20,30,25,.08);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #142822;
      --board: #1d372f;
      --board-edge: #0f201a;
      --ink: #f3efe2;
      --sub: #a9bcb2;
      --line: #2c463c;
      --accent: #ffd76a;
      --accent-ink: #1c2b28;
      --hour: #ffb06a;
      --minute: #ffd76a;
      --good: #8bd17c;
      --bad: #ff8f85;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #142822;
    --board: #1d372f;
    --board-edge: #0f201a;
    --ink: #f3efe2;
    --sub: #a9bcb2;
    --line: #2c463c;
    --accent: #ffd76a;
    --accent-ink: #1c2b28;
    --hour: #ffb06a;
    --minute: #ffd76a;
    --good: #8bd17c;
    --bad: #ff8f85;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.35);
  }
  :root[data-theme="light"] {
    --bg: #eef1ec;
    --board: #ffffff;
    --board-edge: #d7ddd6;
    --ink: #1c2b28;
    --sub: #66756e;
    --line: #dfe6df;
    --accent: #1f8f86;
    --accent-ink: #ffffff;
    --hour: #e8874a;
    --minute: #1f8f86;
    --good: #2ea86b;
    --bad: #e0495c;
    --shadow: 0 1px 2px rgba(20,30,25,.06), 0 10px 26px rgba(20,30,25,.08);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, "Hiragino Maru Gothic ProN", "Zen Maru Gothic", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px calc(24px + var(--safe-b));
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
  }

  .app { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; }

  header { text-align: center; margin-bottom: 4px; }
  header h1 {
    margin: 0;
    font-size: clamp(22px, 6vw, 28px);
    font-weight: 800;
    letter-spacing: .01em;
    text-wrap: balance;
  }
  header h1 .clockmoji { display: inline-block; transform: translateY(1px); }
  header .sub {
    font-size: 13px;
    color: var(--sub);
    margin-top: 4px;
  }

  .levelbar {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 16px 0 6px;
    flex-wrap: wrap;
  }
  .levelbtn {
    border: 1.5px solid var(--line);
    background: var(--board);
    color: var(--ink);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .levelbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .levelbtn.active {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }

  .scorebar {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin: 2px 0 18px;
    font-size: 12px;
    color: var(--sub);
    font-variant-numeric: tabular-nums;
  }
  .scorebar .cell { padding: 4px 12px; border-right: 1px solid var(--line); }
  .scorebar .cell:last-child { border-right: none; }
  .scorebar b { color: var(--ink); font-size: 15px; display: block; font-weight: 800; }

  .clockwrap {
    position: relative;
    width: min(64vw, 260px);
    height: min(64vw, 260px);
    margin: 4px 0 22px;
  }
  .clockwrap.shake { animation: shake .35s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-9px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(3px); }
  }
  .clockwrap.pop { animation: pop .35s; }
  @keyframes pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.07); }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .clockwrap.shake, .clockwrap.pop { animation: none; }
  }

  svg#clockface { width: 100%; height: 100%; display: block; filter: drop-shadow(0 10px 22px rgba(20,30,25,.18)); }
  .face-circle { fill: var(--board); stroke: var(--line); stroke-width: 3; }
  .face-ring { fill: none; stroke: var(--board-edge); stroke-width: 1.5; }
  .tick-major { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
  .tick-minor { stroke: var(--line); stroke-width: 1.5; stroke-linecap: round; }
  .num { fill: var(--ink); font-size: 15px; font-weight: 800; text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums; }
  .hand { stroke-linecap: round; }
  .hand.hour { stroke: var(--hour); stroke-width: 7; }
  .hand.minute { stroke: var(--minute); stroke-width: 4.5; }
  .pivot { fill: var(--ink); }

  .question {
    font-size: 17px;
    font-weight: 800;
    margin: 0 0 14px;
    text-align: center;
  }

  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
  }
  .choice {
    position: relative;
    background: var(--board);
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 20px 8px 16px;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: .01em;
    color: var(--ink);
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .1s, border-color .15s, background .15s, color .15s;
    font-variant-numeric: tabular-nums;
  }
  .choice::before {
    content: "";
    position: absolute;
    top: 8px; left: 50%; transform: translateX(-50%);
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--bg);
    border: 1.5px solid var(--line);
  }
  .choice:active { transform: scale(.96); }
  .choice:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .choice[disabled] { cursor: default; }
  .choice.correct { background: var(--good); border-color: var(--good); color: #fff; }
  .choice.correct::before { background: var(--good); border-color: rgba(255,255,255,.6); }
  .choice.wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
  .choice.wrong::before { background: var(--bad); border-color: rgba(255,255,255,.6); }
  .choice.dim { opacity: .4; }

  .feedback {
    min-height: 30px;
    margin-top: 16px;
    font-size: 18px;
    font-weight: 800;
    text-align: center;
  }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }

  footer {
    text-align: center;
    margin-top: 18px;
    font-size: 12px;
    color: var(--sub);
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span class="clockmoji">⏰</span> とけいの べんきょう</h1>
    <div class="sub">とけいを みて、あう じかんを タップしよう！</div>
  </header>

  <div class="levelbar" id="levelbar"></div>

  <div class="scorebar" id="scorebar">
    <div class="cell">せいかい<b id="scoreGood">0</b></div>
    <div class="cell">もんだい<b id="scoreTotal">0</b></div>
    <div class="cell">れんぞく<b id="scoreStreak">0</b></div>
  </div>

  <div class="clockwrap" id="clockwrap">
    <svg id="clockface" viewBox="0 0 200 200"></svg>
  </div>

  <div class="question">いま なんじ？</div>

  <div class="choices" id="choices"></div>

  <div class="feedback" id="feedback">&nbsp;</div>

  <footer>こたえを タップすると すぐ つぎの もんだいが でるよ</footer>
</div>

<script>
/* ---- レベル定義 ----
   1: ちょうど（〇じ）
   2: 〇じ / 〇じはん
   3: 5ふん きざみ ぜんぶ
*/
const LEVELS = [
  { id: 1, label: "①ちょうど", minutes: [0] },
  { id: 2, label: "②はん", minutes: [0, 30] },
  { id: 3, label: "③5ふんきざみ", minutes: [0,5,10,15,20,25,30,35,40,45,50,55] }
];

let currentLevel = LEVELS[0];
let currentAnswer = null;
let locked = false;
let good = 0, total = 0, streak = 0;

const levelbar = document.getElementById("levelbar");
LEVELS.forEach((lv, i) => {
  const b = document.createElement("button");
  b.className = "levelbtn" + (i === 0 ? " active" : "");
  b.textContent = lv.label;
  b.addEventListener("click", () => {
    currentLevel = lv;
    document.querySelectorAll(".levelbtn").forEach(el => el.classList.remove("active"));
    b.classList.add("active");
    nextQuestion();
  });
  levelbar.appendChild(b);
});

/* ---- 時計盤の描画 ---- */
const svg = document.getElementById("clockface");
const CX = 100, CY = 100, R = 92;

function polar(cx, cy, r, deg) {
  const rad = (deg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function el(name, attrs) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function buildFace() {
  svg.innerHTML = "";
  svg.appendChild(el("circle", { cx: CX, cy: CY, r: R, class: "face-circle" }));
  svg.appendChild(el("circle", { cx: CX, cy: CY, r: R - 6, class: "face-ring" }));

  for (let i = 0; i < 60; i++) {
    const deg = i * 6;
    const major = i % 5 === 0;
    const p1 = polar(CX, CY, R - (major ? 15 : 9), deg);
    const p2 = polar(CX, CY, R - 4, deg);
    svg.appendChild(el("line", { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, class: major ? "tick-major" : "tick-minor" }));
  }

  for (let n = 1; n <= 12; n++) {
    const p = polar(CX, CY, R - 28, n * 30);
    const t = el("text", { x: p.x, y: p.y, class: "num" });
    t.textContent = n;
    svg.appendChild(t);
  }

  svg.appendChild(el("line", { id: "hourHand", x1: CX, y1: CY, x2: CX, y2: CY, class: "hand hour" }));
  svg.appendChild(el("line", { id: "minHand", x1: CX, y1: CY, x2: CX, y2: CY, class: "hand minute" }));
  svg.appendChild(el("circle", { cx: CX, cy: CY, r: 5, class: "pivot" }));
}
buildFace();

function setHands(hour, minute) {
  const hourDeg = ((hour % 12) + minute / 60) * 30;
  const minDeg = minute * 6;
  const hp = polar(CX, CY, R * 0.5, hourDeg);
  const mp = polar(CX, CY, R * 0.75, minDeg);
  document.getElementById("hourHand").setAttribute("x2", hp.x);
  document.getElementById("hourHand").setAttribute("y2", hp.y);
  document.getElementById("minHand").setAttribute("x2", mp.x);
  document.getElementById("minHand").setAttribute("y2", mp.y);
}

/* ---- 問題生成 ---- */
function randItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function labelOf(h, m) { return m === 0 ? h + "じ" : h + "じ" + m + "ふん"; }
function randomTime() {
  return { hour: 1 + Math.floor(Math.random() * 12), minute: randItem(currentLevel.minutes) };
}
function sameTime(a, b) { return a.hour === b.hour && a.minute === b.minute; }

function buildChoices(answer) {
  const list = [answer];
  let guard = 0;
  while (list.length < 4 && guard < 200) {
    guard++;
    let cand;
    const roll = Math.random();
    if (roll < 0.5) {
      let h = answer.hour + (Math.random() < 0.5 ? 1 : -1) * (1 + Math.floor(Math.random() * 3));
      h = ((h - 1) % 12 + 12) % 12 + 1;
      cand = { hour: h, minute: answer.minute };
    } else if (roll < 0.85 && currentLevel.minutes.length > 1) {
      cand = { hour: answer.hour, minute: randItem(currentLevel.minutes) };
    } else {
      cand = randomTime();
    }
    if (!list.some(t => sameTime(t, cand))) list.push(cand);
  }
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

const clockwrap = document.getElementById("clockwrap");
const choicesEl = document.getElementById("choices");
const feedbackEl = document.getElementById("feedback");
const scoreGoodEl = document.getElementById("scoreGood");
const scoreTotalEl = document.getElementById("scoreTotal");
const scoreStreakEl = document.getElementById("scoreStreak");

function nextQuestion() {
  locked = false;
  feedbackEl.textContent = " ";
  feedbackEl.className = "feedback";
  currentAnswer = randomTime();
  setHands(currentAnswer.hour, currentAnswer.minute);

  const choices = buildChoices(currentAnswer);
  choicesEl.innerHTML = "";
  choices.forEach(t => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = labelOf(t.hour, t.minute);
    btn.addEventListener("click", () => onAnswer(btn, t));
    choicesEl.appendChild(btn);
  });
}

function onAnswer(btn, t) {
  if (locked) return;
  locked = true;
  total++;
  const isCorrect = sameTime(t, currentAnswer);

  document.querySelectorAll(".choice").forEach(elm => {
    elm.disabled = true;
    if (elm !== btn) elm.classList.add("dim");
  });

  if (isCorrect) {
    good++; streak++;
    btn.classList.remove("dim");
    btn.classList.add("correct");
    feedbackEl.textContent = "◎ せいかい！";
    feedbackEl.className = "feedback good";
    clockwrap.classList.remove("shake"); clockwrap.classList.add("pop");
    setTimeout(() => clockwrap.classList.remove("pop"), 350);
  } else {
    streak = 0;
    btn.classList.remove("dim");
    btn.classList.add("wrong");
    document.querySelectorAll(".choice").forEach(elm => {
      if (elm.textContent === labelOf(currentAnswer.hour, currentAnswer.minute)) {
        elm.classList.remove("dim");
        elm.classList.add("correct");
      }
    });
    feedbackEl.textContent = "✕ おしい！ せいかいは " + labelOf(currentAnswer.hour, currentAnswer.minute);
    feedbackEl.className = "feedback bad";
    clockwrap.classList.remove("pop"); clockwrap.classList.add("shake");
    setTimeout(() => clockwrap.classList.remove("shake"), 350);
  }

  scoreGoodEl.textContent = good;
  scoreTotalEl.textContent = total;
  scoreStreakEl.textContent = streak;

  setTimeout(nextQuestion, isCorrect ? 900 : 1800);
}

nextQuestion();
</script>

</body>
</html>
